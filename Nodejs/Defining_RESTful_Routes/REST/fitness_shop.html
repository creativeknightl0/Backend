<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Shop</title>
</head>
<body>
    <h1>Fitness and Wellness Mart</h1>
    <h2>GET Request</h2>
    <form action="http://localhost:3000/fitness" method="GET">
        <input type="text" name="name" placeholder="Specific name..." />
        <input type="number" name="qty" placeholder="Quantity" />
        <select name="category">
            <option value="">---Select option---</option>
            <option value="weights">Weights</option>
            <option value="protein">Protein and Creatine</option>
            <option value="clothes">Gym Clothes</option>
        </select>
        <button>Submit</button>
    </form>
    <h2>POST Request</h2>
    <form action="http://localhost:3000/fitness" method="POST">
        <input type="text" name="name" placeholder="Specific name..." />
        <input type="number" name="qty" placeholder="Quantity" />
        <select name="category">
            <option value="">---Select option---</option>
            <option value="weights">Weights</option>
            <option value="protein">Protein and Creatine</option>
            <option value="clothes">Gym Clothes</option>
        </select>
        <button>Submit</button>
    </form>
</body>
</html>
